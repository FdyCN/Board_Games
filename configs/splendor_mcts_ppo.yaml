# Splendor MCTS-Enhanced PPO Training Configuration
# 混合 PPO + MCTS 训练配置

# 游戏配置
game:
  name: "splendor"
  num_players: 4
  seed: null  # null 表示随机

# 模型配置
model:
  encoder_type: "mlp"  # 选项: "mlp", "attention"
  config: "medium"  # 选项: "small", "medium", "large"

# PPO 算法配置
algorithm:
  name: "ppo"
  learning_rate: 0.0001  # 1e-4
  gamma: 0.99  # 折扣因子
  gae_lambda: 0.95  # GAE 参数
  clip_epsilon: 0.1  # PPO clip 参数（用于策略）
  value_clip_epsilon: 0.2  # 价值损失裁剪参数
  value_coef: 0.5  # 价值损失系数
  entropy_coef: 0.01  # 熵正则化系数
  max_grad_norm: 0.5  # 梯度裁剪阈值
  use_value_clip: true  # 启用价值损失裁剪

  # 稠密奖励系数（重要: 只保留胜利奖励!）
  dense_rewards:
    take_gem: 0.0          # 去掉拿宝石奖励
    discard_gem: 0.0       # 去掉丢弃惩罚
    reserve_card: 0.0      # 去掉保留卡牌奖励
    get_gold: 0.0          # 去掉金宝石奖励
    buy_card_points: 0.0   # 去掉买卡分数奖励
    buy_card_bonus: 0.0    # 去掉买卡加成奖励
    noble_visit: 0.0       # 去掉贵族奖励
    win: 1.0               # 只保留胜利奖励!

  # MCTS 配置 (新增)
  mcts:
    enabled: true                # 启用 MCTS 增强
    simulations: 100             # 固定模拟次数 (如果不用调度器)
    c_puct: 1.5                  # UCB 探索常数
    add_noise: true              # 添加 Dirichlet 噪声
    temperature: 1.0             # 采样温度 (1.0=随机, 0.0=确定性)

    # 渐进式增强调度器 (推荐)
    scheduler:
      enabled: true
      schedule:
        - [0, 0]          # 0-199 次迭代: 纯 PPO
        - [200, 50]       # 200-499 次迭代: 50 次 MCTS 模拟
        - [500, 100]      # 500-799 次迭代: 100 次模拟
        - [800, 200]      # 800+ 次迭代: 200 次模拟

# 训练配置
training:
  num_iterations: 1000  # 总迭代次数
  episodes_per_iteration: 128  # 每次迭代收集的 episode 数
  update_epochs: 4  # PPO 更新轮数
  minibatch_size: 256  # 小批次大小
  device: "cpu"  # 设备: "cpu", "cuda", "mps"

  # 数据增强
  use_position_augmentation: true  # 启用位置旋转数据增强

  # 多进程配置
  num_workers: 1  # 并行进程数 (MCTS 暂不支持多进程,设为1)

  # Checkpoint 配置
  checkpoint_dir: "data/checkpoints/splendor_mcts_ppo/mlp_medium_v1"
  checkpoint_interval: 50  # 每 N 次迭代保存检查点

  # 日志配置
  log_interval: 1  # 每 N 次迭代打印日志
  verbose: true

# 评估配置
evaluation:
  eval_interval: 50  # 每 N 次迭代评估一次
  eval_episodes: 100  # 评估时运行的 episode 数
  deterministic: true  # 评估时是否使用确定性策略

# 实验配置
experiment:
  name: "splendor_mcts_ppo_progressive"
  tags: ["splendor", "mcts", "ppo", "progressive"]
  notes: "Progressive MCTS-enhanced PPO training for Splendor (0→50→100→200 sims)"

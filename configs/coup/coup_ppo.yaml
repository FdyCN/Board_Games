# 政变疑云（Coup）PPO 训练配置（3 人对局）
# 基于 best practice：GRU 序列编码 + 强bot对手池（train_league.py）

game:
  name: "coup"
  num_players: 3
  seed: null

model:
  encoder_type: "gru"     # 选项: "mlp", "attention", "gru"
  config: "medium"        # 选项: "small", "medium", "large"

algorithm:
  name: "ppo"
  learning_rate: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.1
  value_clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  use_value_clip: true
  outcome_coef: 1.0

  # 稠密奖励（键由本游戏定义；不写则用 game 的 DEFAULT_REWARDS）
  dense_rewards:
    win: 1.0
    lose_influence: -0.4
    challenge_success: 0.3
    challenge_fail: -0.2
    step_penalty: -0.01

training:
  num_iterations: 500
  episodes_per_iteration: 128
  update_epochs: 4
  minibatch_size: 256
  device: "cpu"
  use_position_augmentation: false
  num_workers: 2
  checkpoint_dir: "data/coup/checkpoints/coup_3p_league_strong_v1"
  checkpoint_interval: 50
  log_interval: 1
  verbose: true

evaluation:
  eval_interval: 50
  eval_episodes: 100
  deterministic: true

experiment:
  name: "coup_ppo_gru_3p_league_strong_v1"
  tags: ["coup", "ppo", "3p", "gru", "league", "strong"]
  notes: "Coup 3 人：GRU 序列编码 + 强bot对手池（league，参照情书 best practice）"
